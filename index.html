<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>دکتر همراه</title>
    <script src="https://cdn.jsdelivr.net/npm/@stlite/browser@0.49.0/build/stlite.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@0.49.0/build/style.css" />
  </head>
  <body style="margin:0; padding:0;">
    <div id="root"></div>
    <script>
      // اضافه کردن یک سیستم گزارش خطا برای اینکه بفهمیم مشکل کجاست
      window.onerror = function(msg, url, lineNo, columnNo, error) {
        document.getElementById('root').innerHTML = `
          <div style="color: red; padding: 20px; text-align: center; direction: rtl;">
            <h2>خطا در اجرای برنامه!</h2>
            <p>${msg}</p>
            <p>خط: ${lineNo}</p>
          </div>`;
        return false;
      };

      stlite.mount({
        requirements: ["streamlit", "pandas", "matplotlib", "numpy"],
        entrypoint: "app.py",
        files: {
          "app.py": `
import streamlit as st
import pandas as pd
import numpy as np
import matplotlib.pyplot as plt

st.set_page_config(page_title="دکتر همراه", page_icon="🩺")

st.title("🩺 دکتر همراه")
st.write("سلام تمنا عزیز! برنامه با موفقیت لود شد.")

# تست نمودار
st.write("### نمودار تست:")
chart_data = pd.DataFrame(np.random.randn(20, 1), columns=['قند خون'])
st.line_chart(chart_data)
          `
        },
      });
    </script>
  </body>
</html>
